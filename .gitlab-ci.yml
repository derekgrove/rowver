# The tests on every push. Remote files stay out: the tests read local files they write
# themselves, or small fixtures in the repository.
rust:
  image: rust:1.91  # not the slim one: rvr's build asks git for the commit, as in a checkout
  script:
    # Every Rust file as rustfmt lays it out, the fuzz harness's too (a workspace of its own).
    - rustup component add rustfmt
    - cargo fmt --all --check
    - rustfmt --edition 2021 --check fuzz/src/lib.rs fuzz/fuzz_targets/*.rs
    # The tests run as an ordinary user: root may write a file marked read-only, and the tests of
    # what is refused need a user who may not.
    - useradd --create-home tester
    - chown -R tester . "$CARGO_HOME"
    - runuser -u tester -- cargo test --workspace --exclude rowver-py --locked

# The Python package: its wheel built with maturin, installed, and its tests run.
python:
  image: rust:1.91
  script:
    - apt-get update -qq && apt-get install -y -qq python3-pip > /dev/null
    - export PIP_BREAK_SYSTEM_PACKAGES=1 PIP_ROOT_USER_ACTION=ignore  # the job's container is its own
    - pip install --quiet maturin==1.15.0 numpy awkward pyarrow pandas
    - cd crates/rowver-py
    - maturin build --release --locked --out dist
    - pip install --quiet dist/*.whl
    - python3 -m unittest discover tests
    - python3 ../rvr-recipe/tests/readme_python.py  # the Awkward side of the recipe README's translations

# Releases are made from the GitHub mirror, where macOS builds: .github/workflows/release.yml.
