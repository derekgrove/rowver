# GitLab Pages at CERN: builds the viewer AND the demo from source, so no generated
# file is ever committed. Nothing is reachable until the site is registered at
# webservices-portal.web.cern.ch/gps and attached under Deploy > Pages — see README.
pages:
  stage: deploy
  image: registry.cern.ch/docker.io/library/python:3.12
  script:
    - pip install --quiet numpy plotly uproot awkward vector
    - python run_rowver.py dimuon_demo
    - python -c "import page; page.viewer()"
    - mkdir -p public
    - mv viewer.html public/index.html
    - cp studies/dimuon_demo/dimuon_demo.rvr public/dimuon_demo.rvr
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
