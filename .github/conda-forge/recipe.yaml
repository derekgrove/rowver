# The conda-forge recipe of the Python package rowver, to submit once to conda-forge/staged-recipes
# (as recipes/rowver/recipe.yaml) after its first PyPI release. conda-forge then keeps it in its
# own repository, rowver-feedstock, whose bot updates it from each new PyPI release.
schema_version: 1

context:
  name: rowver
  version: "15.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: FILL_IN_FROM_PYPI

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.15,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.15,<2
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - rowver
  - script:
      - rvr --version

about:
  homepage: https://gitlab.cern.ch/dgrove/rowver
  repository: https://gitlab.cern.ch/dgrove/rowver
  summary: Read .rvr files as NumPy, Awkward, Arrow and pandas, and make them with rvr.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - derekgrove
