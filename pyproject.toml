[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowver"
version = "11.0.0"
description = "Turn ROOT ntuples into .rvr files for RowVer Web."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy", "awkward", "uproot"]

[project.scripts]
rowver = "rowver.cli:main"

[tool.setuptools]
packages = ["rowver"]
