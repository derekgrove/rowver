[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowver"
version = "0.1.0"
description = "Press ROOT ntuples into .rvr cartridges."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "awkward", "uproot"]

[project.scripts]
rowver = "rowver.cli:main"

[tool.setuptools.packages.find]
include = ["rowver*"]

[tool.setuptools.package-data]
rowver = ["studies/template/*"]
