[workspace]
resolver = "2"
members = ["crates/*"]
# The Python package builds with maturin (it needs a Python); cargo test leaves it out.
default-members = ["crates/rowver", "crates/rvr", "crates/rvr-recipe"]

# Every crate and the Python package share one version, released together; its major is the .rvr
# format version.
[workspace.package]
version = "15.0.0"
authors = ["Derek Grove <derek.william.grove@cern.ch>"]
repository = "https://gitlab.cern.ch/dgrove/rowver"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
rowver = { path = "crates/rowver", version = "15.0.0" }
rvr-recipe = { path = "crates/rvr-recipe", version = "15.0.0" }
rvr = { path = "crates/rvr", version = "15.0.0" }
# The shared HEP crates, from crates.io (each in its own repository, gitlab.cern.ch/dgrove/<crate>).
hep-columns = "0.1.4"
hep-root = "0.2.1"
grid-trust = "0.1.3"
voms-proxy = "0.1.2"
wlcg-doors = "0.1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Arrays are zstd frames (pure Rust; the same version hep-root reads ROOT baskets with).
ruzstd = "0.8"
# Signed files.
ed25519-dalek = "3"
ureq = { version = "2", default-features = false, features = ["tls"] }
toml = { version = "0.8", features = ["preserve_order"] }
zmij = "1"
# Every float function, so every platform computes the same bits (pure Rust; rust-lang's port of musl),
# pinned exactly: a function, once released, keeps its results.
libm = "=0.2.16"
# What rvr reads of grid-trust's TLS errors (a plain-HTTP server behind an upgraded Location), and
# the tests' HTTPS storage; grid-trust already builds it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The Python package only (crates/rowver-py).
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
numpy = "0.30.0"

[profile.release]
debug = 1

# Every dependency (the HEP crates included) optimized in dev and test builds; this workspace's crates as usual.
[profile.dev.package."*"]
opt-level = 2
