# recipe.toml: what this study keeps and stores of every event it reads. Each value is one
# expression over the event's branches, each branch named in full (Muon_pt); rvr branches lists
# the branches the study's files hold. Every table, operator and function, with an example of each:
# https://gitlab.cern.ch/dgrove/rowver/-/blob/main/crates/rvr-recipe/README.md
format = "rvr-recipe"
version = 1
title = "{study}"
# The rows of one chunk of the file's arrays: the default, chosen for most uses. A reader reads,
# checks and decompresses a chunk at a time; change it only knowing why (FORMAT.md §7).
chunk_rows = 65536

# [define]: names for expressions, used by the lines below them. Nothing here is stored.
[define]
good_muon = "Muon_tightId and Muon_pfRelIso04_all < 0.15 and Muon_pt > 20 and abs(Muon_eta) < 2.1"
good_tau = "Tau_idDecayMode and Tau_idIsoTight and Tau_idAntiMuTight and Tau_pt > 20 and abs(Tau_eta) < 2.3"

# [keep]: an event is kept when it passes every line; each line is one step of the cutflow.
[keep]
trigger = "HLT_IsoMu17_eta2p1_LooseIsoPFTau20"
a_good_muon = "count(good_muon) >= 1"
a_good_tau = "count(good_tau) >= 1"

# [columns]: what the file stores. The branches listed are stored as the file holds them, flat or
# one list per event; a line NAME = "expression" is computed while pressing.
[columns]
branches = ["run", "luminosityBlock", "event", "PV_npvs", "MET_pt", "MET_phi", "Muon_pt", "Muon_eta", "Tau_pt", "Tau_eta", "Jet_pt"]

# [totals]: sums over every event read, before the cuts, one value per sample: the sum of
# genWeight, say, to normalize simulation (a derived column can then divide by sample.sumw).
[totals]
# sumw = "genWeight"

# [derived]: columns kept as their expressions over the stored columns, not as arrays, and worked
# out when they are read: a smaller file, for the work of computing them each time.
[derived]
# ht = "sum(Jet_pt)"
