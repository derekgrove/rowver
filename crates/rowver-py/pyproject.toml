[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "rowver"
dynamic = ["version"]
description = "Read .rvr files as NumPy, Awkward, Arrow and pandas, and make them with rvr."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Derek Grove" }]
keywords = ["hep", "cms", "root", "columnar", "numpy"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.urls]
Repository = "https://gitlab.cern.ch/dgrove/rowver"
Documentation = "https://gitlab.cern.ch/dgrove/rowver/-/blob/main/crates/rowver-py/README.md"

[project.optional-dependencies]
# Lists as Awkward arrays; tables as Arrow, pandas and Parquet.
all = ["awkward", "pyarrow", "pandas"]

[project.scripts]
rvr = "rowver._cli:main"

[tool.maturin]
python-source = "python"
# The commit a release builds from, which its sdist job writes here and the source package carries
# (docs/SPEC.md §12.2); gitignored, so a checkout never has one of its own.
include = [{ path = "COMMIT", format = "sdist" }]
module-name = "rowver._rowver"
features = ["pyo3/extension-module"]
