[package]
name = "rowver-py"
# The package's major version is the .rvr format version it reads, as the rowver crate's is.
version = "14.0.0"
description = "The Python package rowver: .rvr files as NumPy, Awkward, Arrow and pandas, and the rvr command."
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_rowver"
crate-type = ["cdylib"]

[dependencies]
rowver.workspace = true
rvr.workspace = true
serde_json.workspace = true
pyo3.workspace = true
numpy.workspace = true
