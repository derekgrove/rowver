[package]
name = "rowver"
# The crate's major version is the .rvr format version it reads and writes.
version.workspace = true
description = "Read, validate and write RowVer .rvr files: event columns as zstd arrays behind a JSON header that carries the recipe, the samples and who signed it"
keywords = ["hep", "physics", "columnar", "rvr", "file-format"]
categories = ["science", "encoding", "parser-implementations"]
readme = "README.md"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "arbitrary_precision", "preserve_order"] }
thiserror.workspace = true
ruzstd.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
zmij.workspace = true
libm.workspace = true
rvr-recipe.workspace = true
