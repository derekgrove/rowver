[package]
name = "rowver"
# The crate's major version is the .rvr format version it reads and writes.
version = "14.1.0"
description = "Read, validate, and write RowVer 14 .rvr files."
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip", "arbitrary_precision", "preserve_order"] }
thiserror.workspace = true
ruzstd.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
zmij.workspace = true
