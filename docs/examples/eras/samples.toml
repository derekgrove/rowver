# Drell-Yan and tt̄ in two eras, UL17 and UL18, from central CMS datasets: each [[sample]] becomes
# one sample per era (DY_UL17, DY_UL18, …). An era's values fill {placeholders} and become each of
# its samples' metadata, so the recipe can read sample.year. Needs a grid proxy (rvr proxy init).

[defaults]
tree = "Events"
events = 50_000

[eras.UL17]
year = 2017
lumi = 41.48                  # fb⁻¹
nano = "RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9"

[eras.UL18]
year = 2018
lumi = 59.83
nano = "RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1"

[[sample]]
name = "DY"
label = "Drell-Yan"
dataset = "/DYJetsToLL_M-50_TuneCP5_13TeV-amcatnloFXFX-pythia8/{nano}-v2/NANOAODSIM"
eras = ["UL17", "UL18"]
xsec = 6077.22                # pb, for illustration: take yours from XSDB

[[sample]]
name = "TT"
label = "tt̄ → 2ℓ"
dataset = "/TTTo2L2Nu_TuneCP5_13TeV-powheg-pythia8/{nano}-v1/NANOAODSIM"
eras = ["UL17", "UL18"]
xsec = 88.29
